# ============================================================
# NGINX REVERSE PROXY — RG Mining + Lighthouse (Production)
# ============================================================
#
# TLS termination, rate limiting, WebSocket upgrade, internal isolation.
# Place in /etc/nginx/conf.d/ or include from nginx.conf.
#
# Services:
#   Mining API + WS  → localhost:8701
#   Lighthouse API   → localhost:8700
#   Lighthouse TCP   → NOT exposed (internal Docker network only)
# ============================================================

# ── Rate Limit Zones ──
limit_req_zone $binary_remote_addr zone=mining_register:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mining_gradient:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=mining_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=lighthouse_register:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lighthouse_heartbeat:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=lighthouse_general:10m rate=60r/m;

# ── Connection Limits ──
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

# ── Upstream ──
upstream mining_backend {
    # Docker: container name resolves via docker network
    # Host: use 127.0.0.1:8701 for local dev
    server mining:8000;
    keepalive 32;
}

upstream lighthouse_backend {
    server lighthouse:8000;
    keepalive 32;
}

# ── Main server block (HTTPS) ──
server {
    listen 443 ssl http2;
    server_name mining.dev-swat.com;

    # TLS — use your real certs (certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/mining.dev-swat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mining.dev-swat.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request size limits
    client_max_body_size 10m;

    # ──────────── MINING SERVICE ────────────

    # Mining WebSocket endpoint
    location /ws/mining {
        limit_conn ws_conn 5;

        proxy_pass http://mining_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Mining — genesis (strict rate limit)
    location /mining/genesis {
        limit_req zone=mining_register burst=3 nodelay;

        proxy_pass http://mining_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mining — gradient submission (moderate rate limit)
    location /mining/gradients {
        limit_req zone=mining_gradient burst=10 nodelay;

        proxy_pass http://mining_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mining — registration
    location /mining/miners/register {
        limit_req zone=mining_register burst=5 nodelay;

        proxy_pass http://mining_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mining — all other endpoints
    location /mining {
        limit_req zone=mining_general burst=20 nodelay;

        proxy_pass http://mining_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mining health (no auth, no rate limit)
    location = /health {
        proxy_pass http://mining_backend;
    }

    # ──────────── LIGHTHOUSE SERVICE ────────────

    # Lighthouse — registration
    location /lighthouse/register {
        limit_req zone=lighthouse_register burst=5 nodelay;

        proxy_pass http://lighthouse_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lighthouse — heartbeat (high frequency)
    location /lighthouse/heartbeat {
        limit_req zone=lighthouse_heartbeat burst=30 nodelay;

        proxy_pass http://lighthouse_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lighthouse — all other endpoints
    location /lighthouse {
        limit_req zone=lighthouse_general burst=15 nodelay;

        proxy_pass http://lighthouse_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lighthouse health (no auth, no rate limit)
    location = /lighthouse/health {
        proxy_pass http://lighthouse_backend;
    }

    # Block direct access to TCP discovery port
    # (TCP :8600 is only accessible within Docker network)
}

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    server_name mining.dev-swat.com;
    return 301 https://$host$request_uri;
}
